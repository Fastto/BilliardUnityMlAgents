behaviors:
  BilliyardBehavior:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512              # Batch size for gradient update
      buffer_size: 2024            # Buffer size, since the agent makes decisions episodically, the buffer can be slightly larger than one episode
      learning_rate: 1.0e-3        # Learning rate
      beta: 1.0e-4                 # Entropy regularization coefficient to improve exploration
      epsilon: 0.2                 # Coefficient that defines the policy change boundaries (PPO clip parameter)
      lambd: 0.95                  # Parameter for Generalized Advantage Estimation (GAE)
      num_epoch: 4                 # Number of epochs for network update
      learning_rate_schedule: linear # Linear decay of the learning rate

    network_settings:
      hidden_units: 64            # Number of neurons in the hidden layers
      num_layers: 2                # Number of hidden layers

    reward_signals:
      extrinsic:
        gamma: 0.99                # Discount factor for future rewards
        strength: 1.0              # Reward weight

    max_steps: 50000000            # Total number of training steps
    time_horizon: 64               # Time horizon for reward estimation
    summary_freq: 1000            # Frequency of recording training statistics
    keep_checkpoints: 5            # Number of checkpoints to keep



environment_parameters:    
  # 0 - game, 1 - center
  white_ball_starting_pos:
    curriculum:
      - name: Lesson0
        completion_criteria:
          measure: reward
          behavior: BilliyardBehavior
          signal_smoothing: true
          min_lesson_length: 20
          require_reset: true
          threshold: 0.7
        value: 1 
      - name: Lesson1
